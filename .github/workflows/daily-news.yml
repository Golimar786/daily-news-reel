name: Daily News Reel
on:
  schedule:
    - cron: "30 2 * * *"    # 8:00 AM IST
    - cron: "30 13 * * *"   # 7:00 PM IST
  workflow_dispatch:

jobs:
  reel:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg + Hindi fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Install free Edge TTS voice
        run: pip install edge-tts
      - run: npm install
      - name: Build and post reel
        run: node src/index.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          LANGUAGE: ${{ vars.LANGUAGE || 'Hindi' }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'Daily News' }}
          VISUAL_SOURCE: ${{ vars.VISUAL_SOURCE || 'pexels' }}
          TTS_ENGINE: ${{ vars.TTS_ENGINE || 'edge' }}
          EDGE_VOICE: ${{ vars.EDGE_VOICE || 'hi-IN-SwaraNeural' }}
          MAX_VEO_CLIPS: ${{ vars.MAX_VEO_CLIPS || '3' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
      - name: Save video for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/
          retention-days: 7
